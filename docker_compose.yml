version: '3.8'

services:
  # ============================================
  # STOCKAGE : MinIO (remplace Google Cloud Storage)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: briancon_storage
    ports:
      - "9000:9000"    # API MinIO (ton code Python l'utilisera)
      - "9001:9001"    # Interface web (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-briancon2026}
    volumes:
      - ./data:/data   # Les fichiers stockés localement
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # CRÉATION DES BUCKETS MinIO
  # ============================================
  createbuckets:
    image: minio/mc
    container_name: briancon_bucket_creator
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin briancon2026;
      /usr/bin/mc mb --ignore-existing myminio/briancon-raw;
      /usr/bin/mc mb --ignore-existing myminio/briancon-gold;
      exit 0;
      "

  # ============================================
  # BASE DE DONNÉES : DuckDB (remplace BigQuery)
  # ============================================
  duckdb:
    image: ghcr.io/duckdb/duckdb:latest
    container_name: briancon_database
    ports:
      - "8001:8001"    # Interface web DuckDB Studio (optionnel)
    volumes:
      - ./data/duckdb:/var/lib/duckdb   # Stockage persistent de la DB
    environment:
      DUCKDB_HOME: /var/lib/duckdb
    healthcheck:
      test: [ "CMD", "test", "-f", "/var/lib/duckdb/briancon.duckdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      sh -c "
      duckdb /var/lib/duckdb/briancon.duckdb -c 'SELECT 1;' || echo 'DB initialized'
      "

# ============================================
# RÉSEAU DOCKER
# ============================================
networks:
  default:
    name: briancon_network