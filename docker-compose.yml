services:
  # ============================================
  # STOCKAGE : MinIO (remplace Google Cloud Storage)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: briancon_storage
    ports:
      - "9000:9000"    # API MinIO (mon code Python l'utilisera)
      - "9001:9001"    # Interface web (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-briancon2026}
    volumes:
      - ./data:/data   # Les fichiers stockés localement
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
  # ============================================
  # CRÉATION DES BUCKETS MinIO
  # ============================================
  createbuckets:
    image: minio/mc
    container_name: briancon_bucket_creator
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin briancon2026;
      /usr/bin/mc mb --ignore-existing myminio/briancon-bronze;
      /usr/bin/mc mb --ignore-existing myminio/briancon-silver;
      /usr/bin/mc mb --ignore-existing myminio/briancon-gold;
      exit 0;
      "
  # ============================================
  # STAGING : PostgreSQL (remplace BigQuery)
  # ============================================
  postgres:
    image: postgres:15
    container_name: briancon_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: briancon2026
      POSTGRES_DB: briancon_db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
  # ============================================
  # ORCHESTRATION : Mage.ai
  # ============================================
  mage:
      image: mageai/mageai:latest
      container_name: briancon_orchestrator
      ports:
        - "6789:6789"    # Interface web Mage.ai (http://localhost:6789)
      volumes:
        - .:/home/src/
      environment:
        USER_CODE_PATH: /home/src/mage_project
        # MAGEAI_API_KEY: ${MAGEAI_API_KEY:-your_api_key_here}
        # MAGEAI_API_SECRET: ${MAGEAI_API_SECRET:-your_api_secret_here}
        # MAGEAI_STORAGE_BACKEND: minio
        # MAGEAI_STORAGE_BUCKET: briancon-bronze
        # MAGEAI_STORAGE_ENDPOINT: http://minio:9000
        # MAGEAI_STORAGE_ACCESS_KEY: ${MINIO_USER:-admin@admin.com}
        # MAGEAI_STORAGE_SECRET_KEY: ${MINIO_PASSWORD:-admin}
      depends_on:
        - minio
        - postgres


# ============================================
# RÉSEAU DOCKER
# ============================================
networks:
  default:
    name: briancon_network
